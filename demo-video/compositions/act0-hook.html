<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Act 0: The Hook & Logo Splash</title>
</head>
<body>
<template>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 900;
      src: local('Inter-Black'), local('Inter Black'), local('Inter');
    }
    @font-face {
      font-family: 'Space Grotesk';
      font-style: normal;
      font-weight: 700;
      src: local('SpaceGrotesk-Bold'), local('Space Grotesk Bold'), local('Space Grotesk');
    }

    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #121316;
      color: #FFFFFF;
      overflow: hidden;
      box-sizing: border-box;
    }

    .dotgrid {
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: radial-gradient(circle, #FFF 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 1;
    }

    .act0-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      overflow: hidden;
      z-index: 5;
    }

    /* Typewriter Card */
    .act0-card-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Refusal Banner docked above the typewriter card (Zero occlusion!) */
    .act0-refusal-banner {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #FF3366;
      color: #FFFFFF;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 10px 28px;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(-20px);
    }

    .act0-typewriter-box {
      width: 1240px;
      background: #FFFDF5;
      border: 4px solid #000;
      box-shadow: 12px 12px 0 #FFDC8B;
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .act0-prompt-label {
      font-family: 'Space Grotesk', monospace;
      font-weight: 700;
      font-size: 16px;
      color: #FF3366;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .act0-typewriter-text {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 40px;
      line-height: 1.25;
      color: #000;
      text-transform: uppercase;
      min-height: 120px;
    }

    .typewriter-cursor {
      display: inline-block;
      width: 14px;
      height: 1.1em;
      background: #F7CB46;
      border: 2px solid #000;
      vertical-align: middle;
      margin-left: 6px;
    }

    /* Clean White Logo Splash */
    .act0-logo-splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #121316;
      gap: 24px;
      opacity: 0;
      transform: scale(0.92);
      z-index: 30;
    }

    .clean-logo-circle {
      width: 160px;
      height: 160px;
      background: #FFFFFF;
      border: 4px solid #000000;
      box-shadow: 8px 8px 0 #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .clean-logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .act0-logo-title {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 82px;
      color: #FFF;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      text-align: center;
      line-height: 1;
    }

    .act0-logo-sub {
      font-family: 'Space Grotesk', monospace;
      font-weight: 700;
      font-size: 18px;
      color: #72F1F8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: #000;
      border: 3px solid #FFF;
      box-shadow: 6px 6px 0 #FFE66D;
      padding: 10px 24px;
    }

    .starburst {
      position: absolute;
      font-size: 80px;
      font-weight: 900;
      z-index: 2;
    }
  </style>

  <div id="root" data-composition-id="act0-hook" data-width="1920" data-height="1080">
    <div class="dotgrid"></div>

    <!-- Ambient Starbursts -->
    <div id="act0-star1" class="starburst" data-layout-allow-overlap="true" data-layout-allow-occlusion="true" style="top: 80px; left: 100px; color: #FFE66D; transform: scale(1.4);">✦</div>
    <div id="act0-star2" class="starburst" data-layout-allow-overlap="true" data-layout-allow-occlusion="true" style="bottom: 90px; right: 120px; color: #FE90E8; transform: scale(1.6);">✦</div>

    <div class="act0-container">
      <!-- Typewriter Section -->
      <div id="act0-tw-stage" class="act0-card-wrapper">
        <!-- Docked Refusal Banner (Above prompt card, never covers text) -->
        <div id="act0-refusal" class="act0-refusal-banner">
          <span>⛔</span>
          <span>MALICIOUS INJECTION REFUSED · ZERO API WRITES</span>
        </div>

        <div id="act0-tw-card" class="act0-typewriter-box">
          <div class="act0-prompt-label">
            <span style="width: 12px; height: 12px; background: #FF3366; border-radius: 50%; display: inline-block;"></span>
            CRITICAL VULNERABILITY SCENARIO
          </div>
          <div id="act0-tw-text" class="act0-typewriter-text">
            <span id="act0-typed-chars"></span><span id="act0-cursor" class="typewriter-cursor"></span>
          </div>
        </div>
      </div>

      <!-- Slam-in Logo Splash (Clean White Circular Background) -->
      <div id="act0-splash-box" class="act0-logo-splash" data-layout-allow-overflow="true">
        <div class="clean-logo-circle">
          <img src="assets/logo.png" alt="Orville Logo" />
        </div>
        <div class="act0-logo-title">
          ORVILLE
        </div>
        <div class="act0-logo-sub">
          GUARDED SUPPORT HANDOFF AGENT · POWERED BY STRANDS SDK
        </div>
      </div>
    </div>
  </div>

  <script>
    const fullText = "WHAT HAPPENS WHEN AN UNTRUSTED BUG REPORT TELLS YOUR AI AGENT: 'DELETE OUR PRODUCTION DATABASE'?";
    const typedEl = document.getElementById('act0-typed-chars');
    const twStage = document.getElementById('act0-tw-stage');
    const refusalEl = document.getElementById('act0-refusal');
    const splashEl = document.getElementById('act0-splash-box');
    const star1 = document.getElementById('act0-star1');
    const star2 = document.getElementById('act0-star2');

    const textProxy = { count: 0 };
    const tl = gsap.timeline({ paused: true });

    // Step 1: Types out from 0.2s to 3.4s (3.2s typing duration matches typewriter audio clicks & ding)
    tl.to(textProxy, {
      count: fullText.length,
      duration: 3.2,
      ease: 'none',
      onUpdate: () => {
        const len = Math.floor(textProxy.count);
        typedEl.textContent = fullText.slice(0, len);
      }
    }, 0.2);

    // Step 2: Holds completely static from 3.4s to 5.4s (2.0s hold for viewer reading!)

    // Step 3: At 5.5s, Refusal banner slides in neatly ABOVE the card (never covers text!)
    tl.to(refusalEl, {
      opacity: 1,
      y: 0,
      duration: 0.45,
      ease: 'back.out(1.8)'
    }, 5.5);

    // Step 4: At 6.8s, typewriter stage slides up and fades out cleanly
    tl.to(twStage, {
      opacity: 0,
      y: -30,
      duration: 0.4,
      ease: 'power3.in'
    }, 6.8);

    // Step 5: At 7.2s, Logo Splash enters with clean white circle and title
    tl.to(splashEl, {
      opacity: 1,
      scale: 1,
      duration: 0.6,
      ease: 'back.out(1.6)'
    }, 7.2);

    // Ambient Starburst subtle rotation
    tl.to(star1, { rotation: 180, duration: 10, ease: 'none' }, 0);
    tl.to(star2, { rotation: -180, duration: 10, ease: 'none' }, 0);

    window.__timelines["act0-hook"] = tl;
  </script>
</template>
</body>
</html>
