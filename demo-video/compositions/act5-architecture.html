<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: local("Space Grotesk"), local("Segoe UI Semibold"), local("Consolas");
        }
        @font-face {
          font-family: "Inter";
          src: local("Inter"), local("Segoe UI"), local("Arial");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #000000;
          color: #FFFFFF;
          font-family: "Inter", sans-serif;
          overflow: hidden;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .dotgrid {
          position: absolute;
          inset: 0;
          opacity: 0.15;
          background-image: radial-gradient(circle, #FFF 1.2px, transparent 1.2px);
          background-size: 28px 28px;
          pointer-events: none;
          z-index: 1;
        }

        .close-frame {
          border: 4px solid #FFFFFF;
          background: #111215;
          color: #FFFFFF;
          box-shadow: 12px 12px 0 #F7CB46;
          padding: 36px 54px;
          width: 1400px;
          max-width: 92%;
          position: relative;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        .orville-emblem {
          width: 85px;
          height: 85px;
          background: #F7CB46;
          border: 3px solid #FFF;
          box-shadow: 5px 5px 0 #000;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 10px;
          overflow: hidden;
        }

        .orville-emblem img {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }

        .close-title {
          font-size: 48px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: -0.03em;
          line-height: 0.95;
          margin-bottom: 22px;
        }

        .arch-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
          width: 100%;
          margin-bottom: 24px;
        }

        .arch-card {
          border: 3px solid #FFF;
          background: #1E1F24;
          box-shadow: 4px 4px 0 #F7CB46;
          padding: 16px;
          text-align: left;
        }

        .arch-pill {
          display: inline-block;
          border: 2px solid #000;
          padding: 3px 8px;
          font-family: "Space Grotesk", monospace;
          font-size: 11px;
          font-weight: 700;
          text-transform: uppercase;
          margin-bottom: 6px;
        }

        .arch-title {
          font-family: "Inter", sans-serif;
          font-weight: 900;
          font-size: 15px;
          text-transform: uppercase;
          margin-bottom: 5px;
          color: #FFF;
        }

        .arch-desc {
          font-family: "Space Grotesk", monospace;
          font-size: 12px;
          line-height: 1.4;
          color: #CCC;
        }

        .receipts-row {
          display: flex;
          gap: 16px;
          justify-content: center;
          width: 100%;
          margin-bottom: 22px;
        }

        .receipt-badge {
          border: 2px solid #FFF;
          background: #000;
          padding: 8px 16px;
          font-family: "Space Grotesk", monospace;
          font-size: 12px;
          font-weight: 700;
          display: flex;
          align-items: center;
          gap: 8px;
          color: #4ADE80;
        }

        .btn-cta {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          border: 3px solid #000;
          background: #F7CB46;
          color: #000;
          box-shadow: 6px 6px 0 #FFF;
          padding: 12px 32px;
          font-family: "Inter", sans-serif;
          font-weight: 900;
          font-size: 17px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
        }

        .star-burst {
          position: absolute;
          background: #FE90E8;
          border: 3px solid #FFF;
          clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
          z-index: 6;
        }
      </style>

      <div id="root" data-composition-id="act5-architecture" data-width="1920" data-height="1080">
        <div class="dotgrid"></div>

        <div id="star-close-1" class="star-burst" style="top: 60px; left: 120px; width: 100px; height: 100px;"></div>
        <div id="star-close-2" class="star-burst" style="bottom: 70px; right: 120px; width: 110px; height: 110px; background: #F7CB46;"></div>

        <div id="close-card" class="close-frame">
          <!-- Logo & Hackathon Header -->
          <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px;">
            <div class="orville-emblem">
              <img src="assets/logo.png" alt="Orville Logo" />
            </div>
            <div style="text-align: left;">
              <div style="font-family: 'Space Grotesk', monospace; font-weight: 700; font-size: 13px; color: #72F1F8; text-transform: uppercase; letter-spacing: 0.08em;">
                AGENTS FOR HUMANS HACKATHON 2026
              </div>
              <div style="font-family: 'Inter', sans-serif; font-weight: 900; font-size: 32px; text-transform: uppercase; color: #FFF; line-height: 1;">
                ORVILLE · GUARDED SUPPORT HANDOFF
              </div>
            </div>
          </div>

          <h1 id="close-head" class="close-title">CUSTOMER HANDOFFS THAT FINISH WITH PROOF</h1>

          <div class="arch-grid">
            <div class="arch-card">
              <span class="arch-pill" style="background: #FE90E8; color: #000;">AGENT CORE</span>
              <div class="arch-title">STRANDS SDK</div>
              <div class="arch-desc">Guarded tool registry, multi-turn loop, and structured exception handling.</div>
            </div>

            <div class="arch-card">
              <span class="arch-pill" style="background: #C0F7FE; color: #000;">REASONING</span>
              <div class="arch-title">GROQ OSS 120B</div>
              <div class="arch-desc">Strict structured issue classification with deterministic safety constraints.</div>
            </div>

            <div class="arch-card">
              <span class="arch-pill" style="background: #99E885; color: #000;">CROSS-APP</span>
              <div class="arch-title">3 DESTINATIONS</div>
              <div class="arch-desc">GitHub Issues + Trello Boards + Discord Webhooks coordinated seamlessly.</div>
            </div>

            <div class="arch-card">
              <span class="arch-pill" style="background: #F7CB46; color: #000;">RELIABILITY</span>
              <div class="arch-title">PROOF RECEIPT</div>
              <div class="arch-desc">Independent GET readbacks, fail-safe human review, and idempotent retries.</div>
            </div>
          </div>

          <div class="receipts-row">
            <div class="receipt-badge"><span>✓</span> LIVE REPOSITORY: github.com/emmaGH1/orville</div>
            <div class="receipt-badge"><span>✓</span> VERIFIED LANDING: orville-tau.vercel.app</div>
            <div class="receipt-badge"><span>✓</span> 42/42 LOCAL TESTS PASSING</div>
          </div>

          <div id="cta-btn" class="btn-cta">
            <span>EXPLORE THE ORVILLE SYSTEM BRIEF</span>
            <span>→</span>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Entrance animation
        tl.from("#close-card", { scale: 0.88, opacity: 0, duration: 0.7, ease: "back.out(1.5)" }, 0.1)
          .from("#close-head", { y: 15, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.4)
          .from(".arch-card", { y: 20, opacity: 0, duration: 0.4, stagger: 0.08, ease: "power3.out" }, 0.6)
          .from(".receipt-badge", { scale: 0.9, opacity: 0, duration: 0.3, stagger: 0.08 }, 0.9)
          .from("#cta-btn", { scale: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 1.1)
          .from("#star-close-1", { scale: 0, rotation: -90, duration: 0.5, ease: "back.out(2)" }, 0.3)
          .from("#star-close-2", { scale: 0, rotation: 90, duration: 0.5, ease: "back.out(2)" }, 0.5);

        // Continuous rotation on stars
        tl.to("#star-close-1", { rotation: 360, duration: 22, ease: "none", repeat: 1 }, 1.0)
          .to("#star-close-2", { rotation: -360, duration: 22, ease: "none", repeat: 1 }, 1.0);

        // Gentle pulse on CTA button
        tl.to("#cta-btn", { scale: 1.04, duration: 0.8, yoyo: true, repeat: 12, ease: "sine.inOut" }, 1.8);

        window.__timelines["act5-architecture"] = tl;
      </script>
    </template>
  </body>
</html>
