<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: local("Space Grotesk"), local("Segoe UI Semibold"), local("Consolas");
        }
        @font-face {
          font-family: "Inter";
          src: local("Inter"), local("Segoe UI"), local("Arial");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #C0F7FE;
          color: #000000;
          font-family: "Inter", sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .dotgrid {
          position: absolute;
          inset: 0;
          opacity: 0.25;
          background-image: radial-gradient(circle, #000 1.5px, transparent 1.5px);
          background-size: 28px 28px;
          pointer-events: none;
          z-index: 1;
        }

        .scene-container {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          padding: 30px 60px;
          z-index: 5;
        }

        .header-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
        }

        .title-block h2 {
          font-size: 38px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: -0.03em;
          line-height: 1;
        }

        .pill {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          border: 3px solid #000;
          background: #FFFFFF;
          box-shadow: 4px 4px 0 #000;
          padding: 6px 18px;
          border-radius: 9999px;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          font-size: 14px;
        }

        .pill-pink { background: #FE90E8; }
        .pill-yellow { background: #F7CB46; }
        .pill-green { background: #99E885; }

        .stage-box {
          position: relative;
          flex: 1;
          display: flex;
          gap: 28px;
          align-items: stretch;
          min-height: 0;
        }

        .window-frame {
          border: 4px solid #000;
          background: #000;
          box-shadow: 8px 8px 0 #000;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          flex: 1.4;
          position: relative;
        }

        .window-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 8px 16px;
          background: #18181B;
          color: #FFF;
          border-bottom: 3px solid #000;
          font-family: "Space Grotesk", monospace;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.06em;
        }

        .window-dots {
          display: flex;
          gap: 7px;
        }

        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          border: 1.5px solid #000;
        }

        .header-status-slot {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        /* Non-occluding docked pills in window header */
        .docked-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          border: 2px solid #000;
          padding: 3px 10px;
          font-family: "Space Grotesk", monospace;
          font-weight: 800;
          font-size: 11px;
          text-transform: uppercase;
          box-shadow: 2px 2px 0 #000;
        }

        .docked-pill-pink { background: #FE90E8; color: #000; }
        .docked-pill-yellow { background: #F7CB46; color: #000; }
        .docked-pill-green { background: #99E885; color: #000; }

        .video-box {
          position: relative;
          width: 100%;
          flex: 1;
          background: #111;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }

        .video-box video {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }

        .info-panel {
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }

        .card-elevated {
          border: 4px solid #000;
          background: #FFFFFF;
          box-shadow: 8px 8px 0 #000;
          padding: 20px;
          position: relative;
        }

        .card-title {
          font-family: "Inter", sans-serif;
          font-weight: 900;
          text-transform: uppercase;
          font-size: 18px;
          letter-spacing: -0.02em;
          margin-bottom: 8px;
        }

        .card-body {
          font-family: "Space Grotesk", monospace;
          font-size: 13px;
          line-height: 1.45;
          color: #222;
        }

        .code-block {
          background: #18181B;
          color: #4ADE80;
          padding: 12px;
          border: 2px solid #000;
          font-family: "Space Grotesk", monospace;
          font-size: 12px;
          line-height: 1.45;
          margin-top: 8px;
          white-space: pre-wrap;
          word-break: break-all;
        }

        .strands-tag {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: #18181B;
          color: #C0F7FE;
          border: 2px solid #000;
          box-shadow: 3px 3px 0 #FE90E8;
          padding: 4px 10px;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 12px;
          margin-bottom: 8px;
        }

        .check-grid {
          display: flex;
          flex-direction: column;
          gap: 8px;
          margin-top: 8px;
        }

        .check-item {
          display: flex;
          align-items: center;
          gap: 8px;
          border: 2px solid #000;
          background: #99E885;
          padding: 7px 12px;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 12px;
          box-shadow: 3px 3px 0 #000;
        }

        .caption-bar {
          margin-top: 14px;
          background: #000;
          color: #FFF;
          border: 3px solid #FFF;
          box-shadow: 6px 6px 0 #F7CB46;
          padding: 10px 24px;
          font-weight: 800;
          font-size: 18px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          width: fit-content;
          align-self: center;
        }
      </style>

      <div id="root" data-composition-id="act2-pipeline" data-width="1920" data-height="1080">
        <div class="dotgrid"></div>

        <div class="scene-container">
          <!-- Header -->
          <div class="header-row">
            <div class="title-block">
              <div id="act2-pill" class="pill pill-pink">ACT II · GUARDED EXECUTION</div>
              <h2 id="act2-title">STRANDS AGENT TOOL WORKFLOW</h2>
            </div>
            <div id="step-pill" class="pill pill-yellow">STEP 1: TERMINAL RUN</div>
          </div>

          <!-- Main Stage Box -->
          <div class="stage-box">
            <!-- Left: Video Window Frame (Broadcast Steady - No Punch-in Zooms) -->
            <div class="window-frame">
              <div class="window-header">
                <div class="window-dots">
                  <div class="dot" style="background: #FF5F56;"></div>
                  <div class="dot" style="background: #FFBD2E;"></div>
                  <div class="dot" style="background: #27C93F;"></div>
                </div>
                <span id="video-title">ORVILLE RUN-STRANDS TERMINAL</span>
                <div class="header-status-slot">
                  <!-- Docked Badges — Always visible in header, never occluding terminal lines -->
                  <span id="pill-refused" class="docked-pill docked-pill-pink" style="display: none;">🛑 DELETION REFUSED</span>
                  <span id="pill-matched" class="docked-pill docked-pill-yellow" style="display: none;">🔍 ISSUE #1 MATCHED</span>
                  <span id="pill-complete" class="docked-pill docked-pill-green" style="display: none;">🏆 3/3 APPS VERIFIED</span>
                  <span id="video-tag" style="color: #4ADE80;">LIVE CONNECTED</span>
                </div>
              </div>
              <div class="video-box">
                <!-- Videos with native HyperFrames timing (40s total) -->
                <video
                  id="vid-fresh"
                  src="assets/video/02-fresh-run.mp4"
                  data-start="0"
                  data-duration="16"
                  data-hf-media-start-basis="local"
                  muted
                  playsinline
                  style="position: absolute; inset: 0;"
                ></video>
                <video
                  id="vid-github"
                  src="assets/video/03-github.mp4"
                  data-start="16"
                  data-duration="8"
                  data-hf-media-start-basis="local"
                  muted
                  playsinline
                  style="position: absolute; inset: 0;"
                ></video>
                <video
                  id="vid-trello"
                  src="assets/video/04-trello.mp4"
                  data-start="24"
                  data-duration="8"
                  data-hf-media-start-basis="local"
                  muted
                  playsinline
                  style="position: absolute; inset: 0;"
                ></video>
                <video
                  id="vid-discord"
                  src="assets/video/05-discord.mp4"
                  data-start="32"
                  data-duration="8"
                  data-hf-media-start-basis="local"
                  muted
                  playsinline
                  style="position: absolute; inset: 0;"
                ></video>
              </div>
            </div>

            <!-- Right: Dynamic Info Panel -->
            <div class="info-panel">
              <!-- Card 1: Tool Dispatch with Strands Tag -->
              <div id="card-action" class="card-elevated">
                <div class="strands-tag">
                  ⚡ STRANDS SDK: <code>SequentialToolExecutor()</code>
                </div>
                <div id="action-title" class="card-title">GUARDED TOOL LOOP</div>
                <div id="action-desc" class="card-body">
                  Strands Agent loop evaluates report, calls candidate search, matches existing issue #1, and refuses the malicious deletion request.
                </div>
                <div id="action-code" class="code-block">
tools: [inspect_report, search_issues]
refused: ["delete_closed_tickets"]
confidence: 0.98 -> Issue #1 matched
                </div>
              </div>

              <!-- Card 2: Readback Receipts -->
              <div id="card-receipts" class="card-elevated">
                <div class="card-title">INDEPENDENT GET READBACKS</div>
                <div class="card-body">
                  Agent does NOT trust the LLM summary. Independent HTTP GET requests verify each record directly from external APIs:
                </div>
                <div class="check-grid">
                  <div id="chk-gh" class="check-item" style="opacity: 0.35;">
                    <span>✓</span> <span>GITHUB COMMENT #5661232219 (200 OK)</span>
                  </div>
                  <div id="chk-tr" class="check-item" style="opacity: 0.35;">
                    <span>✓</span> <span>TRELLO CARD #Tep5Jilu (200 OK)</span>
                  </div>
                  <div id="chk-dc" class="check-item" style="opacity: 0.35;">
                    <span>✓</span> <span>DISCORD MSG #1548975043332284516 (200 OK)</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Caption Bar -->
          <div id="caption-bar-2" class="caption-bar">
            STRANDS AGENT EXECUTES GUARDED WORKFLOW AND REFUSES PROMPT INJECTION
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Phase 1: Terminal Execution (0s - 16s) — Staggered entrance
        tl.from(".window-frame", { scale: 0.96, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.1)
          .from(".info-panel", { x: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.2);

        // Deletion Refusal pill pops in window header at 3.5s (Zero terminal occlusion)
        tl.set("#pill-refused", { display: "inline-flex" }, 3.5)
          .fromTo("#pill-refused",
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" },
            3.5
          );

        // Candidate search matched pill pops in header at 8.0s
        tl.set("#pill-matched", { display: "inline-flex" }, 8.0)
          .fromTo("#pill-matched",
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" },
            8.0
          );

        // Phase 2: GitHub Destination (16s - 24s)
        tl.to(["#pill-refused", "#pill-matched"], { opacity: 0, duration: 0.3 }, 15.5)
          .set(["#pill-refused", "#pill-matched"], { display: "none" }, 16.0)
          .set("#step-pill", { textContent: "DESTINATION 1: GITHUB" }, 16.0)
          .set("#video-title", { textContent: "GITHUB ISSUE #1 — REAL COMMENT POSTED" }, 16.0)
          .set("#action-title", { textContent: "1. GITHUB COMMENT RECORDED" }, 16.0)
          .set("#action-desc", { textContent: "Posted comment to existing Issue #1 containing the report summary and deduplication marker [orville-report-id: HARBOR-STRANDS-05]." }, 16.0)
          .set("#action-code", { textContent: "POST /repos/emmaGH1/orville/issues/1/comments\n-> Comment ID: 5661232219\n-> Marker anchored in body" }, 16.0)
          .to("#chk-gh", { opacity: 1, duration: 0.4, scale: 1.04 }, 17.5)
          .to("#chk-gh", { scale: 1.0, duration: 0.2 }, 18.0)
          .set("#caption-bar-2", { textContent: "DESTINATION 1: COMMENT ATTACHED TO GITHUB ISSUE & INDEPENDENTLY READ BACK" }, 16.0);

        // Phase 3: Trello Destination (24s - 32s)
        tl.set("#step-pill", { textContent: "DESTINATION 2: TRELLO" }, 24.0)
          .set("#video-title", { textContent: "TRELLO BOARD — CUSTOMER FOLLOW-UP CARD" }, 24.0)
          .set("#action-title", { textContent: "2. TRELLO CARD CREATED" }, 24.0)
          .set("#action-desc", { textContent: "Customer follow-up card created in the specified list, embedding the verified GitHub comment URL for seamless team handoff." }, 24.0)
          .set("#action-code", { textContent: "POST /cards\n-> Card ID: Tep5Jilu\n-> Link: github.com/emmaGH1/orville/issues/1#5661232219" }, 24.0)
          .to("#chk-tr", { opacity: 1, duration: 0.4, scale: 1.04 }, 25.5)
          .to("#chk-tr", { scale: 1.0, duration: 0.2 }, 26.0)
          .set("#caption-bar-2", { textContent: "DESTINATION 2: TRELLO CARD CREATED WITH EMBEDDED GITHUB ISSUE LINK" }, 24.0);

        // Phase 4: Discord Destination & Verified Proof (32s - 40s)
        tl.set("#step-pill", { textContent: "DESTINATION 3: DISCORD" }, 32.0)
          .set("#video-title", { textContent: "DISCORD #ORVILLE-DEMO CHANNEL" }, 32.0)
          .set("#action-title", { textContent: "3. DISCORD TEAM UPDATE" }, 32.0)
          .set("#action-desc", { textContent: "Notification posted to Discord webhook with wait=true, returning message ID and linking to both GitHub and Trello records." }, 32.0)
          .set("#action-code", { textContent: "POST /webhooks/.../?wait=true\n-> Message ID: 1548975043332284516\n-> Status: COMPLETE (All 3 readbacks verified)" }, 32.0)
          .to("#chk-dc", { opacity: 1, duration: 0.4, scale: 1.04 }, 33.5)
          .to("#chk-dc", { scale: 1.0, duration: 0.2 }, 34.0)
          // Docked complete badge pops in header cleanly at 34.5s
          .set("#pill-complete", { display: "inline-flex" }, 34.5)
          .fromTo("#pill-complete",
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" },
            34.5
          )
          .set("#caption-bar-2", { textContent: "ALL 3 APPS VERIFIED VIA INDEPENDENT GET READBACKS BEFORE REPORTING COMPLETE" }, 32.0);

        // Act 2 Exit
        tl.to(".scene-container", { y: -25, opacity: 0, duration: 0.5, ease: "power2.in" }, 39.4);

        window.__timelines["act2-pipeline"] = tl;
      </script>
    </template>
  </body>
</html>
