<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: local("Space Grotesk"), local("Segoe UI Semibold"), local("Consolas");
        }
        @font-face {
          font-family: "Inter";
          src: local("Inter"), local("Segoe UI"), local("Arial");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #FE90E8;
          color: #000000;
          font-family: "Inter", sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .dotgrid {
          position: absolute;
          inset: 0;
          opacity: 0.25;
          background-image: radial-gradient(circle, #000 1.5px, transparent 1.5px);
          background-size: 28px 28px;
          pointer-events: none;
          z-index: 1;
        }

        .scene-container {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          padding: 36px 60px;
          z-index: 5;
        }

        .header-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
        }

        .title-block h2 {
          font-size: 40px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: -0.03em;
        }

        .pill {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          border: 3px solid #000;
          background: #FFFFFF;
          box-shadow: 4px 4px 0 #000;
          padding: 6px 18px;
          border-radius: 9999px;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          font-size: 14px;
        }

        .pill-yellow { background: #F7CB46; }
        .pill-blue { background: #C0F7FE; }
        .pill-green { background: #99E885; }

        .content-grid {
          display: grid;
          grid-template-columns: 1.1fr 1.3fr;
          gap: 32px;
          flex: 1;
          align-items: stretch;
          min-height: 0;
        }

        .card-elevated {
          border: 4px solid #000;
          background: #FFFFFF;
          box-shadow: 8px 8px 0 #000;
          padding: 24px;
          display: flex;
          flex-direction: column;
          position: relative;
        }

        .card-header-line {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 12px;
        }

        .card-title {
          font-family: "Inter", sans-serif;
          font-weight: 900;
          font-size: 19px;
          text-transform: uppercase;
          letter-spacing: -0.02em;
        }

        .card-desc {
          font-family: "Space Grotesk", monospace;
          font-size: 14px;
          line-height: 1.45;
          color: #333;
          margin-bottom: 14px;
        }

        .docked-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          border: 2px solid #000;
          padding: 3px 12px;
          font-family: "Space Grotesk", monospace;
          font-weight: 800;
          font-size: 12px;
          text-transform: uppercase;
          box-shadow: 2px 2px 0 #000;
        }

        .docked-pill-yellow { background: #F7CB46; color: #000; }

        .zero-box {
          border: 3px solid #000;
          background: #FFFDF5;
          padding: 18px;
          margin-top: auto;
          box-shadow: 4px 4px 0 #000;
        }

        .zero-title {
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 12px;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #666;
          margin-bottom: 12px;
        }

        .zero-stats {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 12px;
        }

        .stat-badge {
          border: 2px solid #000;
          background: #FEE2E2;
          padding: 10px;
          text-align: center;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 12px;
          box-shadow: 2px 2px 0 #000;
        }

        .stat-badge strong {
          display: block;
          font-size: 26px;
          color: #DC2626;
        }

        .review-window {
          border: 4px solid #000;
          background: #FFFFFF;
          box-shadow: 8px 8px 0 #000;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        .review-header {
          padding: 10px 18px;
          background: #18181B;
          color: #FFF;
          border-bottom: 3px solid #000;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-family: "Space Grotesk", monospace;
          font-size: 13px;
          font-weight: 700;
        }

        .review-body {
          padding: 22px;
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 14px;
          background: #FAFAFA;
        }

        .candidate-option {
          border: 3px solid #000;
          background: #FFF;
          box-shadow: 4px 4px 0 #000;
          padding: 14px 18px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 14px;
        }

        .btn-select {
          border: 2px solid #000;
          background: #F7CB46;
          padding: 7px 16px;
          font-size: 12px;
          font-weight: 800;
          text-transform: uppercase;
          cursor: pointer;
          box-shadow: 2px 2px 0 #000;
        }

        .resume-badge {
          background: #99E885;
          color: #000;
          border: 3px solid #000;
          padding: 10px 18px;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 13px;
          text-align: center;
          margin-top: 10px;
          box-shadow: 4px 4px 0 #000;
        }

        .caption-bar {
          margin-top: 16px;
          background: #000;
          color: #FFF;
          border: 3px solid #FFF;
          box-shadow: 6px 6px 0 #F7CB46;
          padding: 10px 24px;
          font-weight: 800;
          font-size: 18px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          width: fit-content;
          align-self: center;
        }
      </style>

      <div id="root" data-composition-id="act3-escalation" data-width="1920" data-height="1080">
        <div class="dotgrid"></div>

        <div class="scene-container">
          <!-- Header -->
          <div class="header-row">
            <div class="title-block">
              <div class="pill pill-blue" style="margin-bottom: 8px;">ACT III · HUMAN-IN-THE-LOOP SAFETY</div>
              <h2>AMBIGUOUS MATCH? STOP & ESCALATE</h2>
            </div>
            <div id="status-pill" class="pill pill-yellow">STATUS: AWAITING SELECTION</div>
          </div>

          <!-- Content Grid -->
          <div class="content-grid">
            <!-- Left: Ambiguity & Zero Writes Card -->
            <div class="card-elevated">
              <div class="card-header-line">
                <div class="card-title">CONFIDENCE DIVIDED (2 CANDIDATES)</div>
                <!-- Docked status badge in card header — Zero occlusion -->
                <div id="docked-human-pill" class="docked-pill docked-pill-yellow" style="opacity: 0;">
                  ⚠️ NEEDS_HUMAN · 0 WRITES
                </div>
              </div>
              <div class="card-desc">
                When a customer bug report could plausibly match multiple open issues, generic agents guess and corrupt project tracking. Orville enforces a hard stop:
              </div>
              <div class="code-block" style="background: #18181B; color: #72F1F8; padding: 12px; font-family: 'Space Grotesk', monospace; font-size: 13px; border: 2px solid #000; margin-bottom: 12px;">
// Strands Safety Boundary Check:
stop_reason: "needs_human"
candidates_found: [Issue #1, Issue #2]
action: "HALT EXECUTION — ZERO WRITES"
              </div>

              <!-- Zero Writes Box (Broadcast Steady - No Camera Zoom) -->
              <div id="zero-writes-card" class="zero-box">
                <div class="zero-title">OBSERVED WRITES BEFORE OPERATOR APPROVAL:</div>
                <div class="zero-stats">
                  <div id="stat-1" class="stat-badge">
                    <strong>0</strong>
                    <span>GITHUB WRITES</span>
                  </div>
                  <div id="stat-2" class="stat-badge">
                    <strong>0</strong>
                    <span>TRELLO CARDS</span>
                  </div>
                  <div id="stat-3" class="stat-badge">
                    <strong>0</strong>
                    <span>DISCORD POSTS</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right: Simulated Operator UI -->
            <div class="review-window">
              <div class="review-header">
                <span>ORVILLE OPERATOR REVIEW MODAL</span>
                <span id="review-tag" style="color: #F7CB46;">AWAITING SELECTION</span>
              </div>
              <div class="review-body">
                <div style="font-family: 'Space Grotesk', monospace; font-size: 14px; font-weight: 700; color: #333;">
                  Report REVIEW-DEMO-05 matched 2 plausible candidate issues. Choose destination:
                </div>

                <div id="opt-1" class="candidate-option">
                  <div>
                    <div style="color: #000; font-size: 15px;">#1: CSV export stalls on 5k+ rows</div>
                  </div>
                  <button class="btn-select">SELECT</button>
                </div>

                <div id="opt-2" class="candidate-option">
                  <div>
                    <div style="color: #000; font-size: 15px;">#2: Account settings scope check</div>
                  </div>
                  <button id="btn-opt2" class="btn-select">SELECT</button>
                </div>

                <div id="resume-box" class="resume-badge" style="opacity: 0;">
                  ✓ OPERATOR SELECTED ISSUE #2 -> RESUMED -> COMPLETE (1 RECORD PER APP)
                </div>

                <div id="resume-details" style="opacity: 0; font-family: 'Space Grotesk', monospace; font-size: 12px; color: #444; background: #E5E7EB; border: 2px solid #000; padding: 10px; margin-top: 6px;">
                  tool: "operator_selection" -> issue: 2
                  tool: "record_engineering_handoff" -> verified
                  tool: "create_customer_followup" -> verified
                  tool: "publish_team_update" -> verified
                  result: PASS — EXACTLY 1 RECORD PER APP
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Caption Bar -->
          <div id="caption-bar-3" class="caption-bar">
            OPERATOR SELECTION SAFELY RESUMES THE PIPELINE TO COMPLETION
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const dockedHumanPill = document.getElementById("docked-human-pill");

        // Entrance
        tl.from(".content-grid", { scale: 0.96, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.1);

        // Docked badge pops at 2.5s in card header (Zero text occlusion)
        tl.fromTo(dockedHumanPill,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" },
          2.5
        );

        // Snappy motion accent on the zero-stats boxes at 3.5s (Steady frame, no camera zoom)
        tl.fromTo(["#stat-1", "#stat-2", "#stat-3"],
          { scale: 0.95 },
          { scale: 1.05, duration: 0.25, stagger: 0.1, yoyo: true, repeat: 1, ease: "power2.out" },
          3.5
        );

        // Operator selects candidate #2 at 11s — Snappy button press & frame minimize on unselected
        tl.to("#btn-opt2", { scale: 0.92, duration: 0.12, ease: "power2.in" }, 11.0)
          .set("#btn-opt2", { textContent: "CLICKED ✓", background: "#99E885" }, 11.15)
          .to("#btn-opt2", { scale: 1.0, duration: 0.2, ease: "back.out(2)" }, 11.15)
          .to("#opt-2", { background: "#C0F7FE", borderColor: "#000", scale: 1.02, duration: 0.3 }, 11.2)
          .to("#opt-1", { scale: 0.94, opacity: 0.4, duration: 0.3, ease: "power2.in" }, 11.2)
          .fromTo("#resume-box", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" }, 11.8)
          .to("#resume-details", { opacity: 1, duration: 0.4 }, 12.6)
          .set("#status-pill", { textContent: "STATUS: RESUMED & COMPLETE", background: "#99E885" }, 12.8)
          .set("#review-tag", { textContent: "RESOLVED", color: "#22C55E" }, 12.8);

        // Exit at 24.0s — Smoothly minimize frames before scene cut
        tl.to(".content-grid", {
          scale: 0.88,
          y: -25,
          opacity: 0,
          duration: 0.6,
          ease: "back.in(1.3)"
        }, 24.0)
        .to(".scene-container", { opacity: 0, duration: 0.2 }, 24.6);

        window.__timelines["act3-escalation"] = tl;
      </script>
    </template>
  </body>
</html>
