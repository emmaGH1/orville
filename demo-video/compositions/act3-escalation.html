<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: local("Space Grotesk"), local("Segoe UI Semibold"), local("Consolas");
        }
        @font-face {
          font-family: "Inter";
          src: local("Inter"), local("Segoe UI"), local("Arial");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #FE90E8;
          color: #000000;
          font-family: "Inter", sans-serif;
          overflow: hidden;
          box-sizing: border-box;
        }

        .dotgrid {
          position: absolute;
          inset: 0;
          opacity: 0.25;
          background-image: radial-gradient(circle, #000 1.5px, transparent 1.5px);
          background-size: 28px 28px;
          pointer-events: none;
          z-index: 1;
        }

        .scene-container {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          padding: 40px 70px;
          z-index: 5;
        }

        .header-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 24px;
        }

        .title-block h2 {
          font-size: 44px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: -0.03em;
        }

        .pill {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          border: 3px solid #000;
          background: #FFFFFF;
          box-shadow: 4px 4px 0 #000;
          padding: 6px 18px;
          border-radius: 9999px;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          font-size: 14px;
        }

        .pill-yellow { background: #F7CB46; }
        .pill-blue { background: #C0F7FE; }
        .pill-green { background: #99E885; }

        .content-grid {
          display: grid;
          grid-template-columns: 1.1fr 1.3fr;
          gap: 36px;
          flex: 1;
          align-items: stretch;
          min-height: 0;
        }

        .card-elevated {
          border: 4px solid #000;
          background: #FFFFFF;
          box-shadow: 8px 8px 0 #000;
          padding: 26px;
          display: flex;
          flex-direction: column;
          position: relative;
        }

        .card-title {
          font-family: "Inter", sans-serif;
          font-weight: 900;
          font-size: 22px;
          text-transform: uppercase;
          letter-spacing: -0.02em;
          margin-bottom: 12px;
        }

        .card-desc {
          font-family: "Space Grotesk", monospace;
          font-size: 15px;
          line-height: 1.5;
          color: #333;
          margin-bottom: 16px;
        }

        .zero-box {
          border: 3px solid #000;
          background: #FFFDF5;
          padding: 16px;
          margin-top: auto;
        }

        .zero-title {
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 13px;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #666;
          margin-bottom: 10px;
        }

        .zero-stats {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 12px;
        }

        .stat-badge {
          border: 2px solid #000;
          background: #FEE2E2;
          padding: 8px;
          text-align: center;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 13px;
        }

        .stat-badge strong {
          display: block;
          font-size: 24px;
          color: #DC2626;
        }

        .review-window {
          border: 4px solid #000;
          background: #FFFFFF;
          box-shadow: 8px 8px 0 #000;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        .review-header {
          padding: 12px 20px;
          background: #18181B;
          color: #FFF;
          border-bottom: 3px solid #000;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-family: "Space Grotesk", monospace;
          font-size: 13px;
          font-weight: 700;
        }

        .review-body {
          padding: 24px;
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 16px;
          background: #FAFAFA;
        }

        .candidate-option {
          border: 3px solid #000;
          background: #FFF;
          box-shadow: 4px 4px 0 #000;
          padding: 16px 20px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 15px;
          cursor: pointer;
        }

        .btn-select {
          border: 2px solid #000;
          background: #F7CB46;
          padding: 6px 14px;
          font-size: 12px;
          font-weight: 800;
          text-transform: uppercase;
        }

        .resume-badge {
          background: #99E885;
          color: #000;
          border: 3px solid #000;
          padding: 10px 18px;
          font-family: "Space Grotesk", monospace;
          font-weight: 700;
          font-size: 14px;
          text-align: center;
          margin-top: 10px;
          box-shadow: 4px 4px 0 #000;
        }

        .badge-stamp {
          position: absolute;
          border: 4px solid #000;
          box-shadow: 6px 6px 0 #000;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          padding: 12px 22px;
          font-size: 20px;
          z-index: 10;
        }

        .stamp-needs-human {
          top: 240px;
          right: 30px;
          background: #F7CB46;
          color: #000;
          transform: rotate(-3deg);
        }

        .caption-bar {
          margin-top: 18px;
          background: #000;
          color: #FFF;
          border: 3px solid #FFF;
          box-shadow: 6px 6px 0 #F7CB46;
          padding: 12px 28px;
          font-weight: 800;
          font-size: 20px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          width: fit-content;
          align-self: center;
        }
      </style>

      <div id="root" data-composition-id="act3-escalation" data-width="1920" data-height="1080">
        <div class="dotgrid"></div>

        <div class="scene-container">
          <div class="header-row">
            <div class="title-block">
              <div class="pill pill-blue">ACT III · HUMAN-IN-THE-LOOP SAFETY</div>
              <h2>AMBIGUOUS MATCH? STOP & ESCALATE</h2>
            </div>
            <div id="status-pill" class="pill pill-yellow">STATUS: NEEDS_HUMAN</div>
          </div>

          <div class="content-grid">
            <!-- Left Card: Ambiguity Detection -->
            <div id="card-ambiguity" class="card-elevated">
              <div class="card-title">CONFIDENCE DIVIDED BETWEEN 2 CANDIDATES</div>
              <div class="card-desc">
                When a customer bug report could plausibly match multiple open issues, generic agents guess and corrupt project tracking. Orville enforces a hard stop:
              </div>

              <div style="background: #18181B; color: #FFF; padding: 14px; border: 2px solid #000; font-family: monospace; font-size: 13px; line-height: 1.5; margin-bottom: 16px;">
// Strands Safety Boundary Check:
stop_reason: "needs_human"
candidates_found: [Issue #1, Issue #2]
action: "HALT EXECUTION — ZERO WRITES"
              </div>

              <!-- Zero writes proof -->
              <div class="zero-box">
                <div class="zero-title">OBSERVED WRITES BEFORE OPERATOR APPROVAL:</div>
                <div class="zero-stats">
                  <div class="stat-badge"><strong>0</strong> GITHUB WRITES</div>
                  <div class="stat-badge"><strong>0</strong> TRELLO CARDS</div>
                  <div class="stat-badge"><strong>0</strong> DISCORD POSTS</div>
                </div>
              </div>

              <div id="stamp-human" class="badge-stamp stamp-needs-human" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">
                ⚠️ NEEDS_HUMAN · 0 WRITES PERFORMED
              </div>
            </div>

            <!-- Right Card: Operator Selection & Resume -->
            <div id="card-operator" class="review-window">
              <div class="review-header">
                <span>ORVILLE OPERATOR REVIEW MODAL</span>
                <span style="color: #F7CB46;">AWAITING SELECTION</span>
              </div>
              <div class="review-body">
                <p style="font-family: 'Space Grotesk', monospace; font-size: 14px; font-weight: 600;">
                  Report REVIEW-DEMO-05 matched 2 plausible candidate issues. Choose destination:
                </p>

                <!-- Candidate 1 -->
                <div id="cand-1" class="candidate-option">
                  <div>
                    <span style="font-weight: 900;">#1:</span> CSV export stalls on 5k+ rows
                  </div>
                  <div class="btn-select">Select</div>
                </div>

                <!-- Candidate 2 -->
                <div id="cand-2" class="candidate-option">
                  <div>
                    <span style="font-weight: 900;">#2:</span> Account settings scope check
                  </div>
                  <div id="btn-c2" class="btn-select">Select</div>
                </div>

                <!-- Resumed Result Box -->
                <div id="resume-box" class="resume-badge" style="opacity: 0;">
                  ✅ OPERATOR SELECTED ISSUE #2 -> RESUMED -> COMPLETE (1 RECORD PER APP)
                </div>

                <!-- Terminal readback snippet -->
                <div id="resume-trace" style="background: #18181B; color: #4ADE80; padding: 12px; border: 2px solid #000; font-family: monospace; font-size: 12px; opacity: 0;">
tool: "operator_selection" -> issue: 2
tool: "record_engineering_handoff" -> verified
tool: "create_customer_followup" -> verified
tool: "publish_team_update" -> verified
result: PASS — EXACTLY 1 RECORD PER APP
                </div>
              </div>
            </div>
          </div>

          <div id="caption-3" class="caption-bar">
            WHEN AMBIGUOUS, ORVILLE REFUSES TO GUESS — OPERATOR APPROVAL RESUMES SAFELY
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Scene Entrance (0s - 1s)
        tl.from("#card-ambiguity", { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2)
          .from("#card-operator", { x: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.3)
          .from("#stamp-human", { scale: 0, rotation: -20, duration: 0.6, ease: "back.out(2)" }, 1.0);

        // Operator interaction simulation (12s - 18s)
        tl.to("#cand-2", { scale: 1.04, background: "#FEF08A", duration: 0.4 }, 12.0)
          .set("#btn-c2", { textContent: "CLICKED ✓", background: "#4ADE80" }, 13.5)
          .to("#cand-2", { background: "#BBF7D0", duration: 0.3 }, 13.5)
          .to("#resume-box", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 14.5)
          .to("#resume-trace", { opacity: 1, duration: 0.5 }, 16.0)
          .set("#status-pill", { textContent: "STATUS: COMPLETE", background: "#99E885" }, 16.0)
          .set("#caption-3", { textContent: "OPERATOR SELECTION SAFELY RESUMES THE PIPELINE TO COMPLETION" }, 14.5);

        // Scene Exit (29s - 30s)
        tl.to(".scene-container", { y: -40, opacity: 0, duration: 0.7, ease: "power2.in" }, 29.2);

        window.__timelines["act3-escalation"] = tl;
      </script>
    </template>
  </body>
</html>
