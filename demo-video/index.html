<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Orville — Guarded Multi-App Agent Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/blockframe.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Sub-composition host slots stretch to fill root */
      [data-composition-id="orville-demo"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="orville-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="165"
    >
      <!-- Background Audio Track (Upbeat tech groove, 165s) -->
      <audio
        id="bgm"
        src="assets/audio/background-tech.mp3"
        data-start="0"
        data-duration="165"
        data-track-index="0"
      ></audio>

      <!-- Act 1: Hook & Scenario (0s - 25s) -->
      <div
        id="slot-act1"
        data-composition-id="act1-hook"
        data-composition-src="compositions/act1-hook.html"
        data-start="0"
        data-duration="25"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Act 2: Guarded 3-App Strands Run (25s - 85s) -->
      <div
        id="slot-act2"
        data-composition-id="act2-pipeline"
        data-composition-src="compositions/act2-pipeline.html"
        data-start="25"
        data-duration="60"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Act 3: Human Escalation & Review (85s - 115s) -->
      <div
        id="slot-act3"
        data-composition-id="act3-escalation"
        data-composition-src="compositions/act3-escalation.html"
        data-start="85"
        data-duration="30"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Act 4: Idempotent Retry & Test Proof (115s - 145s) -->
      <div
        id="slot-act4"
        data-composition-id="act4-retry"
        data-composition-src="compositions/act4-retry.html"
        data-start="115"
        data-duration="30"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Act 5: Architecture & Closing Plate (145s - 165s) -->
      <div
        id="slot-act5"
        data-composition-id="act5-architecture"
        data-composition-src="compositions/act5-architecture.html"
        data-start="145"
        data-duration="20"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Audio volume automation (gentle fade out at the end)
      tl.to("#bgm", { volume: 0, duration: 4.0, ease: "power2.in" }, 161.0);

      window.__timelines["orville-demo"] = tl;
    </script>
  </body>
</html>
